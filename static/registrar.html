<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrar producto</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body class="bg-light">

    <!-- =====================================================
         ENCABEZADO
         ===================================================== -->

    <header class="bg-info text-white text-center py-4 shadow">

        <div class="container">

            <h1 class="fw-bold">
                Sistema de Inventario
            </h1>

            <p class="lead mb-0">
                Registro de productos
            </p>

        </div>

    </header>


    <!-- =====================================================
         MENÚ DE NAVEGACIÓN
         ===================================================== -->

    <nav class="navbar navbar-dark bg-secondary">

        <div class="container justify-content-center">

            <div class="navbar-nav flex-row gap-3">

                <a class="nav-link text-white" href="index.html">
                    Inicio
                </a>

                <a class="nav-link text-white fw-bold" href="registrar.html">
                    Registrar producto
                </a>

                <a class="nav-link text-white" href="productos.html">
                    Consultar productos
                </a>

            </div>

        </div>

    </nav>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
         ===================================================== -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <section class="card shadow">

                    <div class="card-body p-4">

                        <h2 class="text-center text-info mb-4">
                            Registrar nuevo producto
                        </h2>


                        <!-- =================================================
                             FORMULARIO DE REGISTRO
                             ================================================= -->

                        <form id="formProducto">


                            <!-- Código -->
                            <div class="mb-3">

                                <label for="codigo" class="form-label">
                                    Código
                                </label>

                                <input
                                    type="text"
                                    id="codigo"
                                    name="codigo"
                                    class="form-control"
                                    placeholder="Ejemplo: P001"
                                    required>

                            </div>


                            <!-- Nombre -->
                            <div class="mb-3">

                                <label for="nombre" class="form-label">
                                    Nombre del producto
                                </label>

                                <input
                                    type="text"
                                    id="nombre"
                                    name="nombre"
                                    class="form-control"
                                    placeholder="Ejemplo: Teclado"
                                    required>

                            </div>


                            <!-- Categoría -->
                            <div class="mb-3">

                                <label for="categoria" class="form-label">
                                    Categoría
                                </label>

                                <input
                                    type="text"
                                    id="categoria"
                                    name="categoria"
                                    class="form-control"
                                    placeholder="Ejemplo: Tecnología"
                                    required>

                            </div>


                            <!-- Proveedor -->
                            <div class="mb-3">

                                <label for="proveedor" class="form-label">
                                    Proveedor
                                </label>

                                <input
                                    type="text"
                                    id="proveedor"
                                    name="proveedor"
                                    class="form-control"
                                    placeholder="Ejemplo: Tecno SAS"
                                    required>

                            </div>


                            <!-- Precio -->
                            <div class="mb-3">

                                <label for="precio" class="form-label">
                                    Precio
                                </label>

                                <input
                                    type="number"
                                    id="precio"
                                    name="precio"
                                    class="form-control"
                                    placeholder="Ejemplo: 120000"
                                    min="0"
                                    step="0.01"
                                    required>

                            </div>


                            <!-- Cantidad -->
                            <div class="mb-3">

                                <label for="cantidad" class="form-label">
                                    Cantidad
                                </label>

                                <input
                                    type="number"
                                    id="cantidad"
                                    name="cantidad"
                                    class="form-control"
                                    placeholder="Ejemplo: 10"
                                    min="0"
                                    required>

                            </div>


                            <!-- Stock mínimo -->
                            <div class="mb-3">

                                <label for="stock_minimo" class="form-label">
                                    Stock mínimo
                                </label>

                                <input
                                    type="number"
                                    id="stock_minimo"
                                    name="stock_minimo"
                                    class="form-control"
                                    placeholder="Ejemplo: 5"
                                    min="0"
                                    required>

                            </div>


                            <!-- =================================================
                                 BOTONES
                                 ================================================= -->

                            <div class="d-flex gap-2 justify-content-center mt-4">

                                <button
                                    type="submit"
                                    class="btn btn-primary">

                                    Registrar producto

                                </button>


                                <button
                                    type="reset"
                                    class="btn btn-secondary">

                                    Limpiar formulario

                                </button>

                            </div>

                        </form>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- =====================================================
         PIE DE PÁGINA
         ===================================================== -->

    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <p class="mb-1">
                Sistema Web de Inventario
            </p>

            <small class="text-muted">
                Tecnólogo en Análisis y Desarrollo de Software (ADSO)
            </small>

        </div>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript propio -->
    <script src="js/app.js"></script>

</body>

</html>
